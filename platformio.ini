[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
; board_build.partitions = huge_app.csv  ; uncomment if linker overflows

lib_deps =
    https://github.com/thijses/rplidar.git
    madhephaestus/ESP32Servo@^3.1.3
    adafruit/Adafruit MPU6050@^2.2.9
